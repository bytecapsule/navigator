<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="可搜索、可分类筛选的个人服务导航"><meta name="theme-color" content="#ffffff"><meta name="color-scheme" content="light">
  <title>个人导航</title>
  <style>
    :root{
      --page:#f5f6f8;--surface:#fff;--ink:#0b1220;--muted:#5f6b7d;--line:#e2e6ed;
      --brand:#2563eb;--soft:#eff5ff;--radius:8px;
      --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{margin:0;min-width:320px;background:var(--page);color:var(--ink);font:14px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}
    button,input,select{font:inherit}
    button{cursor:pointer}
    ::selection{background:#dbeafe}

    /* 页头与搜索 */
    .skip{position:absolute;top:-4rem;left:1rem;z-index:3;padding:.7rem 1rem;border-radius:0 0 6px 6px;background:var(--brand);color:#fff}
    .skip:focus{top:0}
    .header{background:var(--surface);border-bottom:1px solid var(--line)}
    .header-in,.layout{width:min(1440px,calc(100% - 32px));margin:auto}
    .header-in{display:flex;align-items:center;gap:22px;padding:11px 0}
    .brand{display:flex;align-items:center;gap:10px;flex:none}
    .logo{display:grid;place-items:center;width:30px;height:30px;border:1px solid #c7d7f7;border-radius:7px;background:var(--soft);color:var(--brand)}
    .logo svg{width:18px;height:18px}
    .brand-text{display:flex;flex-direction:column;gap:1px}
    .header h1{margin:0;font-size:1rem;font-weight:600;letter-spacing:.01em;line-height:1.25;white-space:nowrap}
    .brand-meta{font:10px/1.25 var(--mono);letter-spacing:.1em;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
    .search{display:flex;flex:1;align-items:center;gap:8px;max-width:none}
    .search-box{position:relative;flex:1}
    .search-box::before{content:">";position:absolute;left:11px;top:50%;transform:translateY(-50%);font:12px/1 var(--mono);color:var(--brand);opacity:.8;pointer-events:none}
    .search input{width:100%;height:38px;padding:0 34px 0 26px;border:1px solid var(--line);border-radius:6px;background:var(--page);color:var(--ink);font-size:13px;outline:0;transition:border-color .12s,background .12s,box-shadow .12s}
    .search input::placeholder{color:#647084}
    .search input:focus{border-color:var(--brand);background:var(--surface);box-shadow:0 0 0 3px #2563eb1a}
    .search-box kbd{position:absolute;right:9px;top:50%;transform:translateY(-50%);display:grid;place-items:center;width:18px;height:18px;border:1px solid var(--line);border-radius:4px;background:var(--surface);color:var(--muted);font:10px/1 var(--mono);pointer-events:none}
    .external{height:38px;padding:0 12px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:#334155;font:600 10px/1 var(--mono);letter-spacing:.06em;white-space:nowrap;transition:border-color .12s,background .12s,color .12s}
    .external:hover{border-color:#b7cdf5;background:var(--soft);color:var(--brand)}

    /* 布局与侧栏 */
    .layout{display:grid;grid-template-columns:176px minmax(0,1fr);gap:26px;padding:20px 0 48px}
    .sidebar{position:sticky;top:18px;align-self:start}
    .nav{border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);padding:7px}
    .nav-title{display:block;padding:6px 8px;color:var(--muted);font:10px/1.4 var(--mono);letter-spacing:.12em}
    .nav-list{display:grid;gap:1px}
    .nav-list button{position:relative;display:flex;gap:8px;align-items:center;width:100%;padding:8px 8px 8px 9px;border:0;border-radius:6px;background:transparent;color:#334155;font-size:13px;text-align:left}
    .nav-list button::before{content:"";position:absolute;left:0;top:7px;bottom:7px;width:2px;border-radius:2px;background:transparent}
    .nav-list button:hover{background:#f3f6fb}
    .nav-list button[aria-pressed=true]{background:var(--soft);color:var(--brand);font-weight:600}
    .nav-list button[aria-pressed=true]::before{background:var(--brand)}
    .nav-list small{margin-left:auto;color:inherit;font:10px var(--mono);opacity:.6;font-variant-numeric:tabular-nums}
    .ico{width:18px;height:18px;flex:none}

    /* 内容区 */
    .collection{border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);padding:12px}
    .head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
    .head-main{display:flex;align-items:center;gap:9px;min-width:0}
    .idx{font:10px var(--mono);color:var(--muted);letter-spacing:.06em}
    .head h2{display:flex;align-items:center;gap:7px;margin:0;font-size:13.5px;font-weight:600;white-space:nowrap}
    .head p{margin:0;color:var(--muted);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .count{font:10.5px var(--mono);color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
    .summary{min-height:18px;margin:0 0 12px;color:var(--muted);font:11px var(--mono)}
    .summary:empty{display:none}
    .section{scroll-margin-top:18px;margin-bottom:22px}
    .section>.head{padding-bottom:9px;border-bottom:1px solid var(--line)}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:10px}
    .card{position:relative;min-height:100px;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);transition:border-color .12s,background .12s}
    .card:hover{border-color:#b7cdf5;background:#fbfdff}
    .card-link{display:flex;flex-direction:column;align-items:flex-start;min-height:98px;height:100%;padding:12px;color:var(--ink);text-decoration:none}
    .card-link:focus-visible,button:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
    .name{font-size:13.5px;font-weight:600;line-height:1.35}
    .desc{margin:5px 0 9px;color:var(--muted);font-size:11.5px;line-height:1.45}
    .tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:auto}
    .tag{padding:2px 5px;border:1px solid #e7ebf2;border-radius:4px;color:#66748a;font:10px/1.4 var(--mono)}
    .tag::before{content:"#";margin-right:1px;opacity:.45}
    .empty{display:none;padding:34px 20px;border:1px dashed #c3ccd9;border-radius:var(--radius);background:var(--surface);color:var(--muted);font-size:12px;text-align:center}
    .empty.show{display:block}

    /* 最近访问 */
    #recentBox .head{margin-bottom:12px;padding-bottom:9px;border-bottom:1px solid var(--line)}
    #recent{display:grid;grid-template-columns:repeat(auto-fill,minmax(135px,1fr));gap:10px}
    #recent .card{min-height:0;background:var(--page)}
    #recent .card:hover{background:var(--soft)}
    #recent .card-link{display:block;min-height:0;padding:9px 11px;text-align:center}
    #recent .name{font-size:12px;font-weight:500}
    #recent .desc,#recent .tags{display:none}

    /* 禁用 JavaScript 时的提示 */
    .noscript{margin:0 0 12px;padding:12px 14px;border:1px solid #e8c47a;border-radius:var(--radius);background:#fff8e6;color:#7a5300;font-size:12.5px}

    /* 响应式：依次收窄，窄屏规则只覆盖需要变化的属性 */
    @media(max-width:820px){
      .header-in,.layout{width:min(100% - 24px,1440px)}
      .layout{display:block;padding-top:16px}
      .sidebar{position:static;margin-bottom:14px}
      .nav{overflow-x:auto}
      .nav-list{display:flex;min-width:max-content}
      .nav-list button{width:auto}
    }
    @media(max-width:700px){
      .header-in{align-items:stretch;flex-direction:column;gap:9px;padding:11px 0}
      .search{flex-direction:row;flex-wrap:wrap}
      .search-box{flex-basis:100%}
      .external{flex:1}
      .head p{display:none}
      .section{margin-bottom:18px}
      .card{min-height:96px}
      .card-link{min-height:94px;padding:11px}
    }
    @media(max-width:520px){
      .search-box kbd{display:none}
      .search input{padding-right:12px}
      .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
      .desc{font-size:11px}
    }
    @media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition-duration:.01ms!important}}
  </style>
</head>
<body>
  <a class="skip" href="#main">跳到主要内容</a>
  <header class="header"><div class="header-in"><div class="brand"><span class="logo" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 18V6l10 12V6"/></svg></span><div class="brand-text"><h1>个人导航</h1><span class="brand-meta" id="headerMeta"></span></div></div><form class="search" id="searchForm" role="search"><div class="search-box"><input id="searchInput" type="search" autocomplete="off" placeholder="搜索服务、用途或标签，例如：网盘、视频、代码" aria-label="搜索站内服务"><kbd aria-hidden="true">/</kbd></div><button class="external" type="submit" data-engine="bing" aria-label="用 Bing 搜索">BING ↗</button><button class="external" type="submit" data-engine="google" aria-label="用 Google 搜索">GOOGLE ↗</button></form></div></header>
  <div class="layout"><aside class="sidebar" aria-label="服务分类"><nav class="nav"><span class="nav-title">服务分类</span><div class="nav-list" id="categoryNav"></div></nav></aside><main id="main" tabindex="-1"><noscript><p class="noscript">此页面依赖 JavaScript 显示导航内容，请启用后刷新。</p></noscript><section class="collection" id="recentBox" hidden><div class="head"><div class="head-main"><h2><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>最近访问</h2></div><span class="count">仅保存在此浏览器</span></div><div id="recent"></div></section><p class="summary" id="summary" aria-live="polite"></p><div id="sections"></div><div class="empty" id="empty">没有找到匹配服务。试试更宽泛的词，或清空搜索。</div></main></div>
  <script>
    function initNavigator(data){
    const {categories,services}=data;
    const RECENT_LIMIT=12;
    const load=key=>{try{const value=JSON.parse(localStorage.getItem(key));return Array.isArray(value)?value:[]}catch{return[]}},save=(key,value)=>{try{localStorage.setItem(key,JSON.stringify(value))}catch{}};
    const state={category:'all',query:'',recent:load('navigator-recent')},byId=new Map(services.map(s=>[s.id,s]));
    const $=s=>document.querySelector(s),esc=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
    const ICONS={
      all:'<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>',
      search:'<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>',
      ai:'<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="7" y="7" width="10" height="10" rx="2"/><path d="M9 3v2M15 3v2M9 19v2M15 19v2M3 9h2M3 15h2M19 9h2M19 15h2"/></svg>',
      productivity:'<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h6"/></svg>',
      development:'<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="m7 9 3 3-3 3M13 15h4"/></svg>',
      media:'<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>',
      life:'<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m16 8-2.4 5.6L8 16l2.4-5.6z"/></svg>'
    };
    const icon=name=>ICONS[name]||'';
    $('#headerMeta').textContent=`${services.length} SITES · ${categories.length} GROUPS`;
    const match=s=>!state.query||[s.name,s.description,...s.tags].join(' ').toLowerCase().includes(state.query.toLowerCase());
    function card(s){return `<article class="card" data-id="${s.id}"><a class="card-link" href="${s.url}" target="_blank" rel="noopener noreferrer" aria-label="打开 ${esc(s.name)}（新窗口）"><span class="name">${esc(s.name)}</span><span class="desc">${esc(s.description)}</span><span class="tags">${s.tags.slice(0,3).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</span></a></article>`}
    function renderNav(){const all=[{id:'all',name:'全部',count:services.length},...categories.map(c=>({id:c.id,name:c.name,count:services.filter(s=>s.category===c.id).length}))];$('#categoryNav').innerHTML=all.map(c=>`<button type="button" data-category="${c.id}" aria-pressed="${state.category===c.id}">${icon(c.id)}<span>${c.name}</span><small>${c.count}</small></button>`).join('')}
    function renderRecent(){const items=state.recent.map(id=>byId.get(id)).filter(Boolean);$('#recentBox').hidden=!items.length;$('#recent').innerHTML=items.map(s=>card(s)).join('')}
    function render(){renderNav();renderRecent();let count=0;$('#sections').innerHTML=categories.map((c,i)=>{const items=services.filter(s=>s.category===c.id&&match(s)),selected=state.category==='all'||state.category===c.id;if(selected)count+=items.length;return `<section class="section" id="category-${c.id}" ${!selected||!items.length?'hidden':''}><div class="head"><div class="head-main"><span class="idx">${String(i+1).padStart(2,'0')}</span><h2>${icon(c.id)}${c.name}</h2><p>${c.description}</p></div><span class="count">${items.length} 项</span></div><div class="grid">${items.map(s=>card(s)).join('')}</div></section>`}).join('');const filtered=state.query||state.category!=='all';$('#summary').textContent=filtered?`找到 ${count} 项服务${state.query?`，匹配“${state.query}”`:''}`:'';$('#empty').classList.toggle('show',count===0)}
    $('#categoryNav').addEventListener('click',e=>{const b=e.target.closest('[data-category]');if(!b)return;state.category=b.dataset.category;render();$(state.category==='all'?'#main':`#category-${state.category}`)?.scrollIntoView({behavior:'smooth',block:'start'})});
    document.addEventListener('click',e=>{const link=e.target.closest('.card[data-id]');if(!link)return;state.recent=[link.dataset.id,...state.recent.filter(x=>x!==link.dataset.id)].slice(0,RECENT_LIMIT);save('navigator-recent',state.recent);renderRecent()});
    $('#searchInput').addEventListener('input',e=>{state.query=e.target.value.trim();render()});$('#searchForm').addEventListener('submit',e=>{e.preventDefault();const q=$('#searchInput').value.trim(),base=e.submitter?.dataset.engine==='google'?'https://www.google.com/search?q=':'https://www.bing.com/search?q=';if(q)window.open(base+encodeURIComponent(q),'_blank','noopener')});render();
    document.addEventListener('keydown',e=>{const typing=/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)||e.target.isContentEditable;if(e.key==='/'&&!typing){e.preventDefault();$('#searchInput').focus()}else if(e.key==='Escape'&&document.activeElement===$('#searchInput')){$('#searchInput').value='';state.query='';render();$('#searchInput').blur()}});
    }
    document.addEventListener('DOMContentLoaded',()=>initNavigator(JSON.parse(document.querySelector('#navigator-data').textContent)));
  </script>
